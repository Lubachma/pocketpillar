# Weekly dependency updates — grouped to keep the PR volume low
# (public-repo hygiene lot, 08.2026). CI runs on every PR to main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # freezed 4 requires Dart >=3.13; we pin Flutter 3.44 / Dart 3.12.
      # Lift when the Flutter pin moves (revisit at the next Flutter bump).
      # update-types syntax (not version ranges): the most reliably
      # honored ignore form for pub group updates.
      - dependency-name: freezed
        update-types: ['version-update:semver-major']
      - dependency-name: freezed_annotation
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
