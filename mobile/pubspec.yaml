name: pocketpillar
description: "PocketPillar — prévoyance suisse (iOS/Android)."
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.4.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  supabase_flutter: ^2.17.2
  intl: ^0.20.2
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  file_picker: ^10.3.0
  timezone: ^0.11.1
  package_info_plus: ^9.0.1
  image_picker: ^1.2.3
  purchases_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # Enables localization generation (see l10n.yaml).
  generate: true

# App icons — `dart run flutter_launcher_icons`
# (sources regenerated by `dart run tool/generate_icons.dart`).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#007AFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

# Splash screen — `dart run flutter_native_splash:create`
# (primary blue background, white plate logo + 3 pillars).
flutter_native_splash:
  color: "#007AFF"
  image: assets/icon/icon_splash.png
  ios: true
  android: true
  android_12:
    color: "#007AFF"
    image: assets/icon/icon_splash.png
    icon_background_color: "#FFFFFF"
