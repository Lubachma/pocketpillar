# Fly.io — PocketPillar API.
# Region lhr = London: dub (Dublin) unavailable for this account (observed during
# the 26.08.2026 deployment) — lhr is the closest to Supabase eu-west-1.
app = "pocketpillar-api"
primary_region = "lhr"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Portfolio demo: the machine stops with no traffic (cold start ~2-3 s on the
  # first hit, accepted — spec 2026-08-25 §6). Set back to 1 for a real launch.
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[deploy]
  release_command = "npx prisma migrate deploy --config prisma/prisma.config.ts"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
