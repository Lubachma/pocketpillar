services:
  postgres:
    image: postgres:16-alpine
    container_name: pocketpillar-db
    environment:
      POSTGRES_USER: pocketpillar
      POSTGRES_PASSWORD: pocketpillar
      POSTGRES_DB: pocketpillar
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pocketpillar']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pocketpillar-redis
    command: redis-server --requirepass pocketpillar-dev
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'pocketpillar-dev', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
